<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>AIQuad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrapper">
    <div class="setting-header">
      <div class="banner" id="banner" title="AIQuad">
        <img class="brand" src="assets/logo.png" alt="" />
        AIQuad
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-layout="1" title="单页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
          </svg>
        </button>
        <button class="icon-btn" data-layout="2" title="上下两格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
            <path d="M4 12h16" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" data-layout="4" title="四格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
            <path d="M12 4.5v15M4 12h16" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn sep" id="btn-pin" title="面板置顶">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4h6l-1 6 3.5 3.5H12v6l-1.2-2.2-1.2 2.2v-6H5.5L9 10 9 4z"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-hide" title="收起面板 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 5.5 7.5 12l7 6.5"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="panes" class="size-1"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
