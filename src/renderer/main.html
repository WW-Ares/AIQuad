<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>AIQuad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrapper">
    <div class="setting-header">
      <div class="banner" id="banner" title="AIQuad">
        <img class="brand" src="assets/logo.png" alt="" />
        AIQuad
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-layout="1" title="单页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
          </svg>
        </button>
        <button class="icon-btn" data-layout="2" title="上下两格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
            <path d="M4 12h16" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" data-layout="4" title="四格">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <rect x="4" y="4.5" width="16" height="15" rx="2.5"/>
            <path d="M12 4.5v15M4 12h16" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn sep" id="btn-settings" title="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3.1"/>
            <path d="M12 2.8v2.4M12 18.8v2.4M4.5 12H2.1M21.9 12h-2.4M6.7 6.7 5 5M19 19l-1.7-1.7M6.7 17.3 5 19M19 5l-1.7 1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-hide" title="收起面板 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 5.5 7.5 12l7 6.5"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="panes" class="size-1"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
